<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong ir skeneris — darbi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--ink:#131313;--dim:#6E6E6E;--faint:#B4B4B4;--line:#E4E4E4;--accent:#FF4A40;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 'Inter',system-ui,sans-serif;}
  .wrap{max-width:880px;margin:0 auto;padding:36px 24px 80px;}
  h1{font:italic 400 30px/1.2 'DM Serif Display',Georgia,serif;margin:0 0 4px;}
  .sub{color:var(--dim);font-size:13px;margin-bottom:28px;}
  .sub a{color:var(--ink);}
  .gate{border:1px solid var(--line);border-radius:12px;padding:20px;max-width:380px;}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;}
  input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;}
  button{font:inherit;cursor:pointer;}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:999px;padding:9px 18px;font-size:13px;}
  .btn:hover{opacity:.87}
  .btn[disabled]{opacity:.45;cursor:default}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;}
  .ghost:hover{border-color:var(--ink);}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
  .count{color:var(--dim);font-size:12px;margin-left:auto;}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--dim);
        font-size:13px;margin-bottom:22px;transition:border-color .15s,background .15s;}
  .drop.over{border-color:var(--accent);background:#fff6f5;color:var(--ink);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#faf9f7;position:relative;}
  .card .thumb{aspect-ratio:1;display:block;width:100%;object-fit:cover;background:#f0efec;}
  .card .meta{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;font-size:11px;color:var(--dim);gap:6px;}
  .card .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .rm{background:none;border:none;color:var(--faint);font-size:12px;padding:2px 4px;border-radius:6px;}
  .card .rm:hover{color:#fff;background:var(--accent);}
  .card .rm.armed{color:#fff;background:var(--accent);}
  .card .tag{position:absolute;left:6px;top:6px;background:rgba(19,19,19,.78);color:#fff;font-size:9px;
             padding:2px 6px;border-radius:5px;letter-spacing:.04em;}
  .card.busy{opacity:.45;}
  .msg{margin:16px 0;padding:11px 14px;border-radius:9px;font-size:13px;display:none;}
  .msg.show{display:block}
  .msg.ok{background:#f2f7f3;color:#245c37;}
  .msg.bad{background:#fff3f0;color:var(--accent);}
  .empty{color:var(--dim);font-size:13px;padding:30px 0;}
  .hint{font-size:12px;color:var(--faint);margin-top:26px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Darbi</h1>
  <div class="sub">Šeit pievieno un noņem darbus. Galerija ir <a href="/">šeit</a>.</div>

  <div id="gate" class="gate">
    <label for="pass">Parole</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <div style="margin-top:12px"><button class="btn" id="enter">Ienākt</button></div>
  </div>

  <div id="panel" hidden>
    <div class="bar">
      <button class="btn" id="pick">Pievienot failus</button>
      <button class="ghost" id="logout">Iziet</button>
      <span class="count" id="count"></span>
    </div>
    <div class="drop" id="drop">vai ievelc failus šeit — attēli un īsi video</div>
    <div id="msg" class="msg"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Vēl nav neviena darba.</div>
    <div class="hint">
      Attēliem pietiek ar garāko malu ap 1400 px, video — ap 640 px un bez skaņas.<br>
      Secība galerijā katrā apmeklējumā tik un tā tiek samaisīta.
    </div>
  </div>
</div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>

<script>
const $=id=>document.getElementById(id);
const K='wrong_gallery_pass';
let pass=sessionStorage.getItem(K)||'';

function say(text,bad){
  const m=$('msg'); m.textContent=text;
  m.className='msg show '+(bad?'bad':'ok');
  if(!bad) setTimeout(()=>m.classList.remove('show'),4000);
}
const api=(path,opts={})=>fetch(path,{...opts,headers:{...(opts.headers||{}),'x-gallery-pass':pass}});

async function load(){
  const r=await fetch('/api/works?t='+Date.now(),{cache:'no-store'});
  const works=await r.json();
  const grid=$('grid'); grid.innerHTML='';
  $('empty').hidden=works.length>0;
  $('count').textContent=works.length?works.length+(works.length===1?' darbs':' darbi'):'';
  works.forEach(w=>{
    const c=document.createElement('div'); c.className='card';
    const t=document.createElement(w.kind==='video'?'video':'img');
    t.className='thumb'; t.src=w.url;
    if(w.kind==='video'){ t.muted=true; t.playsInline=true; t.preload='metadata';
      const tag=document.createElement('span'); tag.className='tag'; tag.textContent='video'; c.appendChild(tag); }
    c.appendChild(t);
    const meta=document.createElement('div'); meta.className='meta';
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=w.name||''; nm.title=w.name||'';
    const rm=document.createElement('button'); rm.className='rm'; rm.textContent='dzēst';
    let armed=false,timer=null;
    rm.onclick=async()=>{
      if(!armed){ armed=true; rm.classList.add('armed'); rm.textContent='tiešām?';
        timer=setTimeout(()=>{armed=false;rm.classList.remove('armed');rm.textContent='dzēst';},3000); return; }
      clearTimeout(timer); c.classList.add('busy');
      const res=await api('/api/delete?url='+encodeURIComponent(w.url),{method:'POST'});
      const j=await res.json().catch(()=>({}));
      if(res.ok){ say('Izdzēsts.'); load(); }
      else { c.classList.remove('busy'); say(j.error||'Neizdevās izdzēst',true); }
    };
    meta.append(nm,rm); c.appendChild(meta); grid.appendChild(c);
  });
}

async function upload(files){
  const list=Array.from(files).filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));
  if(!list.length){ say('Der tikai attēli un video.',true); return; }
  $('pick').disabled=true;
  let done=0;
  for(const f of list){
    say('Augšupielādēju '+(done+1)+' no '+list.length+'…');
    const res=await api('/api/upload?name='+encodeURIComponent(f.name),
      {method:'POST',headers:{'content-type':f.type||'application/octet-stream'},body:f});
    const j=await res.json().catch(()=>({}));
    if(!res.ok){ say((f.name||'fails')+': '+(j.error||res.status),true); break; }
    done++;
  }
  $('pick').disabled=false;
  if(done) say(done===list.length?'Gatavs.':'Pievienoti '+done+' no '+list.length+'.');
  load();
}

$('enter').onclick=async()=>{
  pass=$('pass').value;
  const res=await api('/api/upload?name=tests.txt',{method:'POST',body:''});   // 401 = wrong pass
  if(res.status===401){ say('Nepareiza parole.',true); return; }
  sessionStorage.setItem(K,pass);
  $('gate').hidden=true; $('panel').hidden=false; load();
};
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('enter').click(); });
$('logout').onclick=()=>{ sessionStorage.removeItem(K); location.reload(); };
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{ upload(e.target.files); e.target.value=''; };

const drop=$('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>upload(e.dataTransfer.files));

if(pass){ $('gate').hidden=true; $('panel').hidden=false; load(); }
</script>
</body>
</html>
