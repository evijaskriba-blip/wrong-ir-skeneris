<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong art gallery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><script defer src="/_vercel/insights/script.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff;
         --ink:#131313;        /* Wrong Black    */
         --ink-dim:#6E6E6E;    /* Wrong Black 90 */
         --ink-faint:#B4B4B4;
         --line:#E4E4E4;
         --accent:#FF4A40;     /* Wrong Red      */ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#fff; --ink:#131313; --ink-dim:#6E6E6E; --ink-faint:#B4B4B4; --line:#E4E4E4; } }
  :root[data-theme="dark"]{ --bg:#fff; --ink:#131313; --ink-dim:#6E6E6E; --ink-faint:#B4B4B4; --line:#E4E4E4; }
  *{box-sizing:border-box;}
  html,body{height:100%;overscroll-behavior:none;overscroll-behavior-x:none;}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
       overflow:hidden;-webkit-font-smoothing:antialiased;cursor:grab;}
  body.dragging{cursor:grabbing;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:10;}
  header{position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;
         gap:clamp(24px,6.4vh,52px);padding:clamp(20px,5.6vh,46px) 20px 0;z-index:2;pointer-events:none;}
  #collection{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-weight:400;
              font-size:clamp(28px,3.4vw,54px);line-height:1;color:var(--ink);letter-spacing:-0.01em;}
  @media (max-width:760px){ header{gap:22px;} }
  .logo-img{width:clamp(108px,8.4vw,168px);height:auto;display:block;user-select:none;-webkit-user-drag:none;}
  @media (max-width:760px){ .logo-img{width:min(52vw,190px);} }
  .counter{position:fixed;top:28px;right:26px;font-size:11px;color:var(--ink-faint);
           letter-spacing:.05em;z-index:60;}
  .empty{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
         justify-content:center;text-align:center;gap:18px;padding:0 10vw;z-index:20;}
  .empty .brand-lg{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:36px;color:var(--ink);}
  .empty p{color:var(--ink-dim);font-size:13px;max-width:320px;line-height:1.6;margin:0;}
  .add-fab{position:fixed;bottom:22px;right:24px;z-index:61;display:flex;align-items:center;
           gap:8px;background:#fff;border:1px solid var(--ink);color:var(--ink);
           font-family:'Inter',sans-serif;font-size:12px;padding:10px 16px;border-radius:999px;
           cursor:pointer;transition:background .18s ease,color .18s ease;}
  .add-fab:hover{background:var(--ink);color:#fff;}
  .add-fab svg{width:12px;height:12px;}
  #dimLayer{position:fixed;inset:0;z-index:45;background:#131313;
            opacity:0;pointer-events:none;}
  body.zoomed #dimLayer{pointer-events:auto;}
  #zoomImg,#zoomVid{position:fixed;z-index:46;display:none;opacity:0;pointer-events:none;
           object-fit:fill;}
  #shelf{position:fixed;right:24px;bottom:74px;z-index:65;width:min(420px,calc(100vw - 48px));
         max-height:calc(100vh - 110px);display:none;flex-direction:column;
         background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;
         box-shadow:0 24px 60px -28px rgba(19,19,19,.45);}
  #shelf.open{display:flex;}
  #shelfHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  #shelfCount{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-dim);letter-spacing:.04em;}
  #shelfClose{background:none;border:none;font-family:'Inter',sans-serif;font-size:11px;
              color:var(--ink-faint);cursor:pointer;padding:2px 0;border-bottom:1px solid transparent;}
  #shelfClose:hover{color:var(--ink);border-bottom-color:var(--ink);}
  #shelfGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;
             overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1;
             -webkit-overflow-scrolling:touch;}
  .tile{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;
        overflow:hidden;cursor:pointer;background:#faf9f7;}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;}
  .tile.here{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,74,64,.25);}
  .tile .kill{position:absolute;top:3px;right:3px;width:19px;height:19px;border:none;border-radius:50%;
              background:rgba(255,255,255,.9);color:var(--ink);font-size:12px;line-height:19px;
              cursor:pointer;padding:0;opacity:.8;transition:opacity .15s;
              box-shadow:0 1px 4px rgba(19,19,19,.25);}
  .tile:hover .kill{opacity:1;}
  .tile .kill:hover{background:var(--accent);color:#fff;}
  .tile .kill.armed{background:var(--accent);color:#fff;opacity:1;font-weight:700;}
  .tile .vid{position:absolute;left:4px;bottom:4px;background:rgba(19,19,19,.75);color:#fff;
             font-family:'Inter',sans-serif;font-size:9px;padding:1px 5px;border-radius:4px;}
  .tile.add{display:flex;align-items:center;justify-content:center;border-style:dashed;
            font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-dim);text-align:center;padding:6px;}
  .tile.add:hover{border-color:var(--ink-dim);color:var(--ink);}
  @media (max-width:760px){ #shelf{right:12px;left:12px;width:auto;bottom:70px;} }
  /* Names are ordinary text drawn over the scene. As pictures inside the 3D
     view they kept being hidden by textures, depth and draw order; as text they
     either exist or they do not, and they stay crisp at any screen density. */
  #labels{position:fixed;inset:0;z-index:11;pointer-events:none;overflow:hidden;}
  #labels .lab{position:absolute;left:0;top:0;white-space:nowrap;
               font-family:'Inter',system-ui,sans-serif;color:var(--ink-dim);
               font-size:40px;line-height:1;transform-origin:0 0;will-change:transform;}
  #fileInput{display:none;}
  .brandmark-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
                  z-index:2;pointer-events:none;opacity:.9;}
  .brandmark{width:64px;height:auto;display:block;}
  @media (max-width:760px){ .brandmark{width:50px;} }
  .hint{position:fixed;bottom:24px;left:26px;z-index:60;display:flex;gap:18px;align-items:center;
        color:var(--ink-faint);font-size:10.5px;letter-spacing:.02em;line-height:1;}
  .hint span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .hint svg{width:13px;height:13px;flex:none;opacity:.9;}
  @media (max-width:760px){
    .hint{gap:12px;bottom:20px;left:18px;}
    .add-fab span{display:none;}
    .add-fab{padding:12px;border-radius:50%;}
    }
</style>
</head>

// the same picture added twice is still one work
function dedupe(list){
  const seen=new Set(), out=[];
  (list||[]).forEach(it=>{
    const key=it&&it.src; if(!key||seen.has(key)) return;
    seen.add(key); out.push(it);
  });
  return out;
}
// a different walk through the room on every visit
function shuffle(list){
  const out=list.slice();
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=out[i]; out[i]=out[j]; out[j]=t;
  }
  return out;
}

// ---- scene ----------------------------------------------------------------
function initScene(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(40,1,0.05,60);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min((devicePixelRatio||1)*1.75, 3));  // supersample: fights moire
  renderer.outputEncoding=THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);
  // a lost graphics context used to freeze the gallery; recover from it instead
  const cv=renderer.domElement;
  cv.addEventListener('webglcontextlost',e=>{ e.preventDefault(); ctxLost=true; }, false);
  cv.addEventListener('webglcontextrestored',()=>{ ctxLost=false; try{ buildGroups(); }catch(e){} }, false);
  raycaster=new THREE.Raycaster(); pointer=new THREE.Vector2();
  solveSlots();
  resize();
}
// On a narrow screen a 40-degree lens sees almost nothing sideways, so the room
// looks like a wall with one picture. Widen the view and make the works smaller
// so the side walls come into frame and it reads as a room again.
let WORK_SCALE=1;
function fitToScreen(){
  const a=innerWidth/innerHeight;
  camera.fov = 40;
  WORK_SCALE = Math.min(1, 0.92*a + 0.36); SIDE = Math.max(0.55, Math.min(1.42, 0.8*Math.tan(camera.fov*Math.PI/360)*a*FAR)); PERIM = 4*SIDE+2*DEPTH; resolveSoon();
}

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; fitToScreen(); camera.updateProjectionMatrix();
  solveSlots();
  groups.forEach(g=>{ if(g.userData.tex) rebuildMesh(g); });
}

// One straight wall each side, a wall facing you and a wall behind you.
// The works hang along this single path, so each one lies flat on its wall
// and creases only where the path turns a corner.
const DEPTH=FAR+BEHIND;
let PERIM=4*SIDE+2*DEPTH;
const SLOT=PERIM/SLOTS_N;

// same walk, but writing into a holder that gets reused. Called for every point
// of every work on every frame, so allocating here is what creates the churn.
const _w1={x:0,z:0}, _w2={x:0,z:0}, _w3={x:0,z:0}, _w4={x:0,z:0};
function walkInto(s,out){
  let t=s % PERIM; if(t<0) t+=PERIM;
  if(t<=SIDE){ out.x=t; out.z=-FAR; return out; }
  t-=SIDE;
  if(t<=DEPTH){ out.x=SIDE; out.z=-FAR+t; return out; }
  t-=DEPTH;
  if(t<=2*SIDE){ out.x=SIDE-t; out.z=BEHIND; return out; }
  t-=2*SIDE;
  if(t<=DEPTH){ out.x=-SIDE; out.z=BEHIND-t; return out; }
  t-=DEPTH;
  out.x=-SIDE+t; out.z=-FAR; return out;
}

function walk(s){
  let t=s % PERIM; if(t<0) t+=PERIM;
  if(t<=SIDE)   return {x:t,      z:-FAR};        // far wall, right half
  t-=SIDE;
  if(t<=DEPTH)  return {x:SIDE,   z:-FAR+t};      // right wall
  t-=DEPTH;
  if(t<=2*SIDE) return {x:SIDE-t, z:BEHIND};      // the wall behind you
  t-=2*SIDE;
  if(t<=DEPTH)  return {x:-SIDE,  z:BEHIND-t};    // left wall
  t-=DEPTH;
  return {x:-SIDE+t, z:-FAR};                     // far wall, left half
}
// Equal arc steps along the walls do not look equal on screen: the far wall is
// flat and the side walls run away from you. So the resting places are solved
// for instead — spaced so the gaps you actually see come out the same.
let SLOT_R=[0,1.48,3.34,4.55,5.9,7.2], SLOT_L=SLOT_R.slice();

// How wide the work sitting at a given place actually is. A landscape scan
// takes up far more room than a portrait one, so the gaps can only come out
// even if each work is measured rather than assumed.
function widthAt(off){
  const n=items.length; if(!n) return H*0.92;
  let idx=-1;
  for(let i=0;i<n;i++){ if(Math.round(relOffset(i))===off){ idx=i; break; } }
  const g=idx>=0?groups[idx]:null;
  const ar=(g&&g.userData.aspect)||1;
  return H*WORK_SCALE*ar;
}

function solveSide(sign){
  const fov=camera.fov*Math.PI/180, f=1/Math.tan(fov/2), aspect=innerWidth/innerHeight;
  const gap=innerWidth*0.075;
  const sx=p=>((p.x*f/aspect)/(-p.z)*0.5+0.5)*innerWidth;
  // sample across the whole width: a work creased at a corner sticks out further
  // than a straight line between its two edges would suggest
  const edges=(a,w)=>{
    let lo=Infinity, hi=-Infinity;
    for(let i=0;i<=8;i++){
      const q=walk(sign*a-w/2+w*i/8);
      if(q.z>=-0.05) return null;
      const v=sx(q); if(v<lo) lo=v; if(v>hi) hi=v;
    }
    return [lo,hi];
  };
  const first=edges(0,widthAt(0)); if(!first) return null;
  const arcs=[0]; let prev=sign>0?first[1]:first[0];
  const clears=(e)=> sign>0 ? e[0]>=prev+gap : e[1]<=prev-gap;
  for(let k=1;k<=5;k++){
    const w=widthAt(sign*k);
    let lo=arcs[k-1]+0.05, hi=null;
    for(let a=lo; a<PERIM/2; a+=0.08){          // coarse sweep
      const e=edges(a,w); if(!e) break;
      if(clears(e)){ hi=a; break; }
      lo=a;
    }
    if(hi===null){ break; }
    for(let i=0;i<10;i++){                      // then halve the gap ten times
      const mid=(lo+hi)/2, e=edges(mid,w);
      if(e&&clears(e)) hi=mid; else lo=mid;
    }
    const e=edges(hi,w); if(!e) break;
    prev=sign>0?e[1]:e[0];
    arcs.push(hi);
  }
  // Always hand back the same number of places. A shorter list changes the rule
  // used for the works further out, and they jump sideways when it happens.
  while(arcs.length<6){
    const step=arcs.length>1?arcs[arcs.length-1]-arcs[arcs.length-2]:1.5;
    arcs.push(arcs[arcs.length-1]+step);
  }
  return arcs;
}
let resolveTimer=null;
function resolveSoon(){ clearTimeout(resolveTimer); resolveTimer=setTimeout(solveSlots,120); }

let SLOT_R_T=null, SLOT_L_T=null;
function solveSlots(){
  const step=PERIM/10;
  const plain=[0,step,step*2,step*3,step*4,step*5];
  SLOT_R_T=solveSide(1)||plain;
  SLOT_L_T=solveSide(-1)||plain;
}

// Ease the places towards their new values. Applied all at once, even a small
// change shows up as every work twitching sideways together.
function easeSlots(){
  const pairs=[[SLOT_R,SLOT_R_T],[SLOT_L,SLOT_L_T]];
  for(let p=0;p<2;p++){
    const cur=pairs[p][0], want=pairs[p][1];
    if(!want) continue;
    if(cur.length!==want.length){ cur.length=0; for(let i=0;i<want.length;i++) cur.push(want[i]); continue; }
    const k=1-Math.pow(1-0.09,frameStep());
    for(let i=0;i<cur.length;i++) cur[i]+=(want[i]-cur[i])*k;
  }
}

function arcFor(o){
  const s=Math.sign(o)||1, a=Math.abs(o);
  const T=s>0?SLOT_R:SLOT_L, last=T.length-1;
  const step=T[last]-T[last-1];
  // the resting places are unevenly spaced, so joining them with straight lines
  // made the works change speed the moment they passed one. A smooth curve
  // through the same places keeps the speed continuous.
  const at=k=>k<0 ? -at(-k) : (k<=last ? T[k] : T[last]+(k-last)*step);
  const k=Math.floor(a), t=a-k;
  const p0=at(k-1), p1=at(k), p2=at(k+1), p3=at(k+2);
  const v=0.5*((2*p1) + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t*t + (-p0+3*p1-3*p2+p3)*t*t*t);
  return s*v;
}

// a flat sheet whose vertices we move onto the wall path every frame
function sheetGeometry(w,h){
  const g=new THREE.PlaneGeometry(w,h,SEG_W,SEG_H);
  g.userData.w=w;
  // the sheet is moved around the room every frame, so give it a bounding
  // sphere big enough to always hold it and never recompute one mid-flight
  g.boundingSphere=new THREE.Sphere(new THREE.Vector3(0,0,-FAR/2), PERIM);
  return g;
}

// "4scan-20260730-153054-300dpi.jpg" reads better as "4scan 20260730 153054 300dpi"
function tidyName(raw){
  return String(raw||'')
    .replace(/\.[A-Za-z0-9]+$/,'')            // drop the extension
    .replace(/-[A-Za-z0-9]{16,}$/,'')          // drop the store's random suffix
    .replace(/[_-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

// "4scan-20260730-153054-300dpi.jpg" reads better as "4scan 20260730 153054 300dpi"

const labelBox=$('labels'), LAB_BASE=40;
function makeLabel(g,item){

function rebuildMesh(g){
  const ar=g.userData.aspect||1, h=H*WORK_SCALE, w=h*ar;
  if(g.userData.art){ g.remove(g.userData.art); g.userData.art.geometry.dispose(); }
  const art=new THREE.Mesh(sheetGeometry(w,h),
    new THREE.MeshBasicMaterial({map:g.userData.tex,side:THREE.DoubleSide}));
  g.add(art); g.userData.art=art;

  g.userData.w=w;

}

function buildGroups(){
  if(labelBox) labelBox.innerHTML='';
  groups.forEach(g=>scene.remove(g)); groups=[];
  const loader=new THREE.TextureLoader();
  items.forEach(item=>{
    const g=new THREE.Group();
    g.userData={item, aspect:1, tex:null};
    scene.add(g); groups.push(g);
    makeLabel(g, item);
    if(isVideo(item)){
      const v=videoElementFor(item.src);
      const finish=()=>{
        try{
          const tex=new THREE.VideoTexture(v);
          tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
          tex.generateMipmaps=false;
          tex.encoding=THREE.sRGBEncoding;
          g.userData.tex=tex; g.userData.video=v;
          g.userData.aspect=(v.videoWidth||16)/(v.videoHeight||9);
          rebuildMesh(g);
          resolveSoon();
        }catch(e){}
      };
      if(v.readyState>=1) finish(); else v.onloadedmetadata=finish;
      return;
    }
    loader.load(item.src, tex=>{
      try{
        tex.encoding=THREE.sRGBEncoding;
        tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
        tex.generateMipmaps=true;
        tex.minFilter=THREE.LinearMipmapLinearFilter;   // smooth when squashed
        tex.magFilter=THREE.LinearFilter;
        tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
        tex.needsUpdate=true;
        g.userData.tex=tex;
        g.userData.aspect=(tex.image.width||1)/(tex.image.height||1);
        rebuildMesh(g);
        resolveSoon();
      }catch(e){}
    }, undefined, ()=>{});
  });
  updateUI();
}

// ---- hanging the works on the walls ---------------------------------------
function relOffset(i){
  const n=items.length; if(!n) return 0;
  let o=(i-cur)%n; if(o>n/2) o-=n; if(o<-n/2) o+=n;
  return o;
}

function place(){
  const n=items.length; if(!n) return;
  groups.forEach((g,i)=>{
    const art=g.userData.art; if(!art){ if(g.userData.lab) g.userData.lab.style.display='none'; return; }
    const geo=art.geometry, pos=geo.attributes.position;
    const w=geo.userData.w||1;
    const s0=arcFor(relOffset(i));

    // the work you are walking towards flattens out, so a crease at a corner
    // unfolds instead of staying bent while you look straight at it
    const flat=(zoomOn===i)?zoomE:0;
    let tx=0,tz=0,cx=0,cz2=0;
    if(flat>0){
      const c=walkInto(s0,_w2), l=walkInto(s0-0.01,_w3), r=walkInto(s0+0.01,_w4);
      tx=r.x-l.x; tz=r.z-l.z;
      const m=Math.hypot(tx,tz)||1; tx/=m; tz/=m;
      cx=c.x; cz2=c.z;
    }

    for(let k=0;k<pos.count;k++){
      const lx=geo.attributes.uv.getX(k)*w-w/2;   // where this column sits across the sheet
      const ly=pos.getY(k);
      const p=walkInto(s0+lx,_w1);                // ...and where that lands on the walls
      let px=p.x, pz=p.z;
      if(flat>0){
        px += ((cx+tx*lx)-px)*flat;
        pz += ((cz2+tz*lx)-pz)*flat;
      }
      pos.setXYZ(k, px, ly, pz);
    }
    pos.needsUpdate=true;

    const mid=walkInto(s0,_w2);
    const off=Math.abs(relOffset(i));
    // Anything past about 2.5 places is already off the side of the screen, and
    // that is also where the spacing figures stop being solved and start being
    // guessed. Drawing them only made those guesses visible as jumps.
    const behind=(mid.z>-0.45) || off>2.75;
    g.visible=!behind;

    const lab=g.userData.lab;
    if(lab){
      if(behind){ lab.style.display='none'; }
      else {
        // two points along the wall under the work: where the name starts, and
        // how long a known distance looks from here. That gives its place, its
        // angle and its size in one go.
        const yy=-H*WORK_SCALE/2-0.052*WORK_SCALE;
        const a=walkInto(s0-w/2, _w3), ax=a.x, az=a.z;
        const b=walkInto(s0-w/2+0.5, _w4), bx=b.x, bz=b.z;
        _v.set(ax,yy,az).project(camera);
        const sx1=(_v.x*0.5+0.5)*innerWidth, sy1=(-_v.y*0.5+0.5)*innerHeight;
        _v.set(bx,yy,bz).project(camera);
        const sx2=(_v.x*0.5+0.5)*innerWidth, sy2=(-_v.y*0.5+0.5)*innerHeight;
        const len=Math.hypot(sx2-sx1, sy2-sy1);
        if(!isFinite(len) || len<1){ lab.style.display='none'; }
        else {
          const ang=Math.atan2(sy2-sy1, sx2-sx1);
          const size=Math.max(7, Math.min(22, len*0.062));
          lab.style.display='block';
          lab.style.fontSize=LAB_BASE+'px';
          const STEP=0.5,LAB_EM=0.055*WORK_SCALE,o1=walkInto(s0-w/2,_w3);_v.set(o1.x,yy,o1.z).project(camera);const px0=(_v.x*0.5+0.5)*innerWidth,py0=(-_v.y*0.5+0.5)*innerHeight,pz0=_v.z;const o2=walkInto(s0-w/2+STEP,_w4);_v.set(o2.x,yy,o2.z).project(camera);const pxX=(_v.x*0.5+0.5)*innerWidth,pyX=(-_v.y*0.5+0.5)*innerHeight;_v.set(o1.x,yy+STEP,o1.z).project(camera);const pxY=(_v.x*0.5+0.5)*innerWidth,pyY=(-_v.y*0.5+0.5)*innerHeight;const kk=LAB_EM/(LAB_BASE*STEP),a1=(pxX-px0)*kk,b1=(pyX-py0)*kk,c1=-(pxY-px0)*kk,d1=-(pyY-py0)*kk;if(pz0>1||!isFinite(a1)||Math.hypot(a1,b1)<0.001){lab.style.display='none';}else{lab.style.transform='matrix('+a1.toFixed(4)+','+b1.toFixed(4)+','+c1.toFixed(4)+','+d1.toFixed(4)+','+px0.toFixed(1)+','+py0.toFixed(1)+')';}
        }
      }
    }

  });
}

// ---- walking up to a work --------------------------------------------------
const dimLayer=$('dimLayer'), zoomImg=$('zoomImg'), zoomVid=$('zoomVid');
const headerEl=document.querySelector('header'), markEl=document.querySelector('.brandmark-wrap');
const _v=new THREE.Vector3();
const lookAt=new THREE.Vector3();

// where the work lands on screen right now
function screenRect(i){
  const g=groups[i]; if(!g||!g.userData.art) return null;
  const pos=g.userData.art.geometry.attributes.position;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let k=0;k<pos.count;k++){
    _v.set(pos.getX(k),pos.getY(k),pos.getZ(k)).project(camera);
    const sx=(_v.x*0.5+0.5)*innerWidth, sy=(-_v.y*0.5+0.5)*innerHeight;
    if(sx<x0)x0=sx; if(sx>x1)x1=sx; if(sy<y0)y0=sy; if(sy>y1)y1=sy;
  }
  if(!isFinite(x0)||!isFinite(y0)) return null;
  return {left:x0, top:y0, width:Math.max(2,x1-x0), height:Math.max(2,y1-y0)};
}

// where to stand so the work fills most of the view, and what to look at
function viewpointFor(i){
  const g=groups[i];
  const w=(g&&g.userData.art)?(g.userData.art.geometry.userData.w||1):1;
  const s0=arcFor(relOffset(i));
  const c=walkInto(s0,_w2), l=walkInto(s0-0.01,_w3), r=walkInto(s0+0.01,_w4);
  // the wall's inward normal at that spot
  let nx=-(r.z-l.z), nz=(r.x-l.x);
  const m=Math.hypot(nx,nz)||1; nx/=m; nz/=m;
  if(c.x*nx+c.z*nz>0){ nx=-nx; nz=-nz; }      // always point back into the room
  const vfov=camera.fov*Math.PI/180;
  const needH=(H/2)/Math.tan(vfov/2)/0.72;
  const needW=(w/2)/Math.tan(vfov/2)/(camera.aspect*0.66);
  const dist=Math.max(needH,needW);
  return {pos:{x:c.x+nx*dist, z:c.z+nz*dist}, look:{x:c.x, z:c.z}};
}

function zoomTo(i){ lastZoomIdx=i; zoomIdx=i; focusIdx=i; document.body.classList.add('zoomed'); updateUI(); }
function unzoom(){
  if(zoomIdx===null&&focusIdx===null) return;
  zoomIdx=null; focusIdx=null;
  document.body.classList.remove('zoomed');
  updateUI();
}
dimLayer.addEventListener('click',unzoom);

// move the camera a step towards (or back from) the work, every frame
function driveCamera(){
  const want=zoomIdx===null?0:1;
  zoomOn = zoomIdx!==null?zoomIdx:lastZoomIdx;
  zoomT += (want-zoomT)*(1-Math.pow(1-0.085,frameStep()));
  if(Math.abs(want-zoomT)<0.001) zoomT=want;

  if(zoomT<0.0015){
    zoomE=0;
    camera.position.set(0,0,0);
    camera.lookAt(0,0,-FAR);
    zoomImg.style.display='none'; zoomImg.style.opacity='0';
    zoomVid.style.display='none'; zoomVid.style.opacity='0';
    if(zoomVid.getAttribute('src')){ zoomVid.pause(); zoomVid.removeAttribute('src'); zoomVid.load(); }
    renderer.domElement.style.filter='none';
    dimLayer.style.opacity='0';
    if(headerEl){ headerEl.style.filter='none'; headerEl.style.opacity=''; }
    if(markEl){ markEl.style.filter='none'; markEl.style.opacity=''; } if(labelBox){ labelBox.style.filter='none'; labelBox.style.opacity=''; }
    return;
  }
  const i=zoomIdx!==null?zoomIdx:lastZoomIdx;
  if(i===null||!groups[i]) return;
  const v=viewpointFor(i);
  const e=zoomT*zoomT*(3-2*zoomT);                     // ease in and out
  zoomE=e;
  camera.position.set(v.pos.x*e, 0, v.pos.z*e);
  lookAt.set(v.look.x*e, 0, -FAR+(v.look.z+FAR)*e);
  camera.lookAt(lookAt);

  // the room only starts to soften once you are nearly there
  const soft=Math.max(0,(e-0.45)/0.55);
  renderer.domElement.style.filter='blur('+(11*soft).toFixed(2)+'px)';
  dimLayer.style.opacity=(0.10*e).toFixed(3);   // 10% over everything behind the work

  // and the work itself is laid over it, sharp, exactly where it appears
  // the title and the mark soften along with the room
  // walking up to a work, the titles fade away rather than hang around blurred
  const soften='blur('+(7*soft).toFixed(2)+'px)';
  const fade=Math.max(0,1-e*1.6).toFixed(3);
  if(headerEl){ headerEl.style.filter=soften; headerEl.style.opacity=fade; }
  if(markEl){ markEl.style.filter=soften; markEl.style.opacity=fade; } if(labelBox){ labelBox.style.filter=soften; labelBox.style.opacity=fade; }

  const r=screenRect(i);
  if(r){
    const video=isVideo(items[i]);
    const el=video?zoomVid:zoomImg, other=video?zoomImg:zoomVid;
    other.style.display='none'; other.style.opacity='0';
    if(el.getAttribute('src')!==items[i].src){
      el.src=items[i].src;
      if(video){ const src=groups[i]&&groups[i].userData.video;
        if(src) el.currentTime=src.currentTime||0;
        el.play().catch(()=>{}); }
    }
    el.style.display='block';
    el.style.left=r.left+'px';  el.style.top=r.top+'px';
    el.style.width=r.width+'px'; el.style.height=r.height+'px';
    const op=Math.max(0,Math.min(1,(e-0.5)/0.32));
    el.style.opacity=op.toFixed(3);
    // once the sharp copy covers it, drop the blurred original underneath —
    // otherwise its soft edge shows around the picture like a shadow
    if(groups[i]) groups[i].visible = op<0.9;
  }
}
let lastZoomIdx=null;

// which work is in front of you right now
function activeIndex(){
  const n=items.length; if(!n) return -1;
  return focusIdx!==null?focusIdx:((Math.round(cur)%n)+n)%n;
}


// ---- saving the gallery into the page itself -------------------------------
// ---- navigation ------------------------------------------------------------
function go(d){ if(focusIdx!==null) unzoom(); snapTo=Math.round(snapTo===null?cur:snapTo)+d; vel=0; velT=0; inbox=0; }

// walk round to a particular work by the shortest way
function goToIndex(i){
  const n=items.length; if(!n) return;
  if(focusIdx!==null) unzoom();
  let o=((i-Math.round(cur))%n+n)%n;
  if(o>n/2) o-=n;
  snapTo=Math.round(cur)+o; vel=0; velT=0; inbox=0;
}
function focusOn(i){
  if(focusIdx===i){ unzoom(); return; }
  if(focusIdx!==null) unzoom();
  zoomTo(i);
}
addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.isContentEditable) return;
  if(e.key==='Escape') unzoom();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault(); go(-1);}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault(); go(1);}
});
addEventListener('wheel',e=>{
  if(e.cancelable) e.preventDefault();
  if(shelf.contains(e.target)) return;          // let the list scroll on its own
  if(!items.length) return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(!d) return;
  if(focusIdx!==null) unzoom();
  // A mouse sends a few big clicks, a trackpad a stream of small ones. Treating
  // each as a push into a moving weight makes both feel the same: it keeps
  // gliding between clicks instead of stopping and starting.
  // No momentum and no settling: the works move exactly as far as the fingers
  // do, and stop when they stop.
  cur += Math.sign(d)*Math.min(1,Math.abs(d)/110)*0.16;
  vel=0; velT=0; inbox=0; snapTo=null;
},{passive:false});

let down=null, moved=false;
function pDown(x,y,t){ if(t&&t.isContentEditable) return; down={x,y}; moved=false; document.body.classList.add('dragging'); }
function pMove(x){
  if(!down) return;
  const dx=x-down.x;
  if(Math.abs(dx)>4) moved=true;
  if(moved){
    if(focusIdx!==null) unzoom();
    const step=(down.x-x)/(innerWidth*0.42);
    cur+=step; vel=step; velT=0; inbox=0; snapTo=null;   // follow the hand
    down.x=x;
  }
}
function pUp(x,y){ document.body.classList.remove('dragging'); if(down&&!moved) pick(x,y); else if(moved) snapTo=null; down=null; }
addEventListener('mousedown',e=>{ if(e.target.closest('button')) return; pDown(e.clientX,e.clientY,e.target); });
addEventListener('mousemove',e=>pMove(e.clientX));
addEventListener('mouseup',e=>pUp(e.clientX,e.clientY));
addEventListener('touchstart',e=>{ if(e.target.closest('button')) return; pDown(e.touches[0].clientX,e.touches[0].clientY,e.target); },{passive:true});
addEventListener('touchmove',e=>pMove(e.touches[0].clientX),{passive:true});
addEventListener('touchend',e=>{ const t=e.changedTouches[0]; pUp(t.clientX,t.clientY); },{passive:true});

function pick(x,y){
  if(shelf.classList.contains('open')){ closeShelf(); return; }
  if(!items.length) return;
  pointer.set((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
  raycaster.setFromCamera(pointer,camera);
  const meshes=groups.filter(g=>g.visible&&g.userData.art).map(g=>g.userData.art);
  const hit=raycaster.intersectObjects(meshes,false)[0];
  if(hit) focusOn(groups.indexOf(hit.object.parent));
  else unzoom();
}


function say(){}   // no status line on the hosted version

// ---- the shelf: everything that has been added -----------------------------
const shelf=$('shelf'), shelfGrid=$('shelfGrid'), shelfCount=$('shelfCount');

function drawShelf(){
  shelfGrid.innerHTML='';
  const here=activeIndex();
  items.forEach((it,i)=>{
    const t=document.createElement('div');
    t.className='tile'+(i===here?' here':'');
    t.title='Iet pie šī darba';
    if(isVideo(it)){
      const v=document.createElement('video');
      v.src=it.src; v.muted=true; v.playsInline=true; v.preload='metadata';
      t.appendChild(v);
      const tag=document.createElement('span'); tag.className='vid'; tag.textContent='video';
      t.appendChild(tag);
    } else {
      const im=document.createElement('img'); im.src=it.src; im.alt=''; t.appendChild(im);
    }
    t.addEventListener('click',()=>{ goToIndex(i); closeShelf(); });
    shelfGrid.appendChild(t);
  });
  shelfCount.textContent=items.length? items.length+(items.length===1?' darbs':' darbi') : 'vēl nekā nav';
}
function openShelf(){ drawShelf(); shelf.classList.add('open'); }
function closeShelf(){ shelf.classList.remove('open'); }
function toggleShelf(){ shelf.classList.contains('open')?closeShelf():openShelf(); }
$('shelfClose').addEventListener('click',closeShelf);
shelf.addEventListener('mousedown',e=>e.stopPropagation());
shelf.addEventListener('click',e=>e.stopPropagation());

// ---- adding images ---------------------------------------------------------
$('addBtn').onclick=toggleShelf;
addEventListener('keydown',e=>{ if(e.key==='Escape') closeShelf(); });
addEventListener('resize',resize);

function updateUI(){
  const n=items.length;
  emptyState.style.display=n?'none':'flex';
  counter.textContent=n?(activeIndex()+1)+' / '+n:'';
}

let lastKey=null;
function tick(){
  requestAnimationFrame(tick);
  try{
    // All of these used to be "per frame", which meant a 120 Hz screen ran the
    // whole motion twice as fast as a 60 Hz one — the glide died before it got
    // going. They are measured against real time now, so it feels the same
    // whatever the screen does.
    const now=performance.now();
    const dt=Math.min(3, (now-lastFrame)/16.667) || 1;
    lastFrame=now; frameDT=dt;
    // Only a key press or a tap on a thumbnail animates: those set a target and
    // spring to it. Wheel and drag move the position straight away.
    if(snapTo!==null){
      const K=0.055, DAMP=2*Math.sqrt(0.055);
      vel += ((snapTo-cur)*K - vel*DAMP)*dt;
      cur += vel*dt;
      if(Math.abs(snapTo-cur)<0.0005 && Math.abs(vel)<0.0008){ cur=snapTo; vel=0; snapTo=null; }
    } else {
      vel=0; velT=0; inbox=0;
    }

    easeSlots(); place(); driveCamera();

    const k=Math.round(cur)+'|'+focusIdx;
    if(k!==lastKey){ lastKey=k; resolveSoon(); updateUI(); }
    if(!ctxLost){
      renderer.render(scene,camera);
    }
  }catch(e){
    if(!window.__shown){ window.__shown=1;
      const b=document.getElementById('errBox');
      if(b){ b.style.display='block'; b.textContent='Kadra kļūda: '+(e&&e.message||e)+'\n'+(e&&e.stack||'').split('\n').slice(0,4).join('\n'); }
    }
  }
}

if(typeof THREE==='undefined') throw new Error('Three.js neielādējās');
initScene(); tick();



// the list of works lives in the store behind /api/works, so it can change
// without touching the code or waiting for a deploy
fetch('/api/works?t='+Date.now(), {cache:'no-store'})
  .then(r=>r.ok?r.json():Promise.reject(new Error('sarakstu neizdevās ielādēt')))
  .then(list=>{
    items=shuffle(dedupe((list||[]).map((w,i)=>({
      id:'w'+i,
      src:typeof w==='string'?w:(w.url||w.src),
      kind:(typeof w==='object'&&w.kind)||'',
      name:tidyName((typeof w==='object'&&(w.title||w.name))||'')
    }))));
    cur=0; vel=0; velT=0; snapTo=0;
    buildGroups(); updateUI();
    if(!items.length){
      const p=document.querySelector('.empty p');
      if(p) p.innerHTML='Vēl nav neviena darba. Pievieno tos <a href="/admin.html" style="color:inherit">šeit</a>.';
    }
  })
  .catch(err=>{
    const b=document.getElementById('errBox');
    if(b){ b.style.display='block'; b.textContent='Neizdevās ielādēt darbu sarakstu: '+(err&&err.message||err); }
  });
}catch(err){
  const b=document.getElementById('errBox');
  if(b){ b.style.display='block'; b.textContent='Galerija neieslēdzās: '+(err&&err.message||err); }
}
})();

</script>
